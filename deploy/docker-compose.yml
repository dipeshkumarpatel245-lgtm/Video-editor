services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      - VT_BROKER_URL=redis://redis:6379/0
      - VT_WORKSPACE=/data
    command: ["uvicorn", "server.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    volumes:
      - workspace:/data
    depends_on:
      - redis
      - worker

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      - VT_BROKER_URL=redis://redis:6379/0
      - VT_WORKSPACE=/data
      - VT_ENCODER=libx264
    command: ["celery", "-A", "workers.celery_app:celery_app", "worker", "-l", "info", "-Q", "analysis,render", "-c", "1"]
    volumes:
      - workspace:/data
    depends_on:
      - redis

volumes:
  redis-data:
  workspace: